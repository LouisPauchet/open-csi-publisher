sources:
  - id: loggernet_test_server
    type: loggernet
    config_provider: folder
    config_location: sample_configs/
    data_location: mount/loggernet-test-server/

# Example: two independent ThingsBoard tenants. Left commented out here since this
# is the sources.yaml the whole test suite and default dev server load — an active
# thingsboard entry would make every request that resolves dataset locations try to
# reach a real ThingsBoard tenant, which doesn't exist in CI/dev (see
# docs/architecture.md and docs/adding_a_dataset.md#adding-a-thingsboard-backed-dataset).
# Copy this into your own deployment's sources.yaml to enable it there.
#
#  - id: thingsboard_svalbard
#    type: thingsboard
#    config_provider: thingsboard
#    config_location: ""
#    data_location: ""
#    credentials_env_prefix: THINGSBOARD_SVALBARD
#
#  - id: thingsboard_ny_alesund
#    type: thingsboard
#    config_provider: thingsboard
#    config_location: ""
#    data_location: ""
#    credentials_env_prefix: THINGSBOARD_NY_ALESUND

# Example: LoggerNet data and dataset configs read directly from an S3 bucket (no
# volume mount). Strictly read-only. `s3:///path` (empty host) takes the bucket from
# LN_OFS_S3_BUCKET; `s3://my-bucket/path` names it explicitly. Credentials, endpoint
# and region come from LN_OFS_S3_ACCESS_KEY_ID / _SECRET_ACCESS_KEY / _ENDPOINT /
# _REGION (see .env.example). Keys and file_name values are identical to the
# mounted-volume layout, so switching an existing source does not re-index anything.
#
#  - id: loggernet_ofs
#    type: loggernet
#    config_provider: folder
#    config_location: s3:///__config__/
#    data_location: s3:///
#    credentials_env_prefix: LN_OFS_S3
